# AR Elec — builds an Android APK from index.html + scan-test.html in this repository.
# Upload this file as .github/workflows/build-apk.yml, plus index.html and scan-test.html at the repo root.
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Move web files out of the way
        run: |
          mkdir -p /tmp/web
          cp index.html scan-test.html /tmp/web/
      - name: Write settings.gradle
        run: |
          cat > settings.gradle <<'ARELEC_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AR Elec"
          include ':app'
          ARELEC_EOF
      - name: Write build.gradle
        run: |
          cat > build.gradle <<'ARELEC_EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          ARELEC_EOF
      - name: Write gradle.properties
        run: |
          cat > gradle.properties <<'ARELEC_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ARELEC_EOF
      - name: Write app/build.gradle
        run: |
          mkdir -p app
          cat > app/build.gradle <<'ARELEC_EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.arelec.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.arelec.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '0.1-prototype'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // only the WebView helper; no AppCompat (avoids the Kotlin stdlib duplicate-class clash)
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          ARELEC_EOF
      - name: Write app/src/main/AndroidManifest.xml
        run: |
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ARELEC_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ARELEC_EOF
      - name: Write app/src/main/res/values/strings.xml
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'ARELEC_EOF'
          <resources>
              <string name="app_name">AR Elec</string>
          </resources>
          ARELEC_EOF
      - name: Write app/src/main/java/com/arelec/app/MainActivity.java
        run: |
          mkdir -p app/src/main/java/com/arelec/app
          cat > app/src/main/java/com/arelec/app/MainActivity.java <<'ARELEC_EOF'
          package com.arelec.app;

          import android.Manifest;
          import android.app.Activity;
          import android.annotation.SuppressLint;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          /**
           * Thin WebView shell around the AR Elec web app.
           * Pages are served from https://appassets.androidplatform.net/assets/ so the WebView treats them
           * as a secure origin: camera (getUserMedia), GPS and motion sensors all work.
           * Note: Android WebView has no WebXR, so the app uses its sensor-fusion tracking here.
           */
          public class MainActivity extends Activity {
              private static final int REQ = 42;
              private static final String START = "https://appassets.androidplatform.net/assets/index.html";
              private WebView web;
              private PermissionRequest pendingCam;
              private ValueCallback<Uri[]> fileCallback;
              private NativeBridge bridge;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  bridge = new NativeBridge(this, web);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (bridge != null) bridge.sendCamera();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (has(Manifest.permission.CAMERA)) {
                                  request.grant(request.getResources());
                              } else {
                                  pendingCam = request;
                                  askPermissions();
                              }
                          });
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, has(Manifest.permission.ACCESS_FINE_LOCATION), false);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), 7);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  askPermissions();
                  web.loadUrl(START);
              }

              private boolean has(String p) {
                  return checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED;
              }

              private void askPermissions() {
                  if (!has(Manifest.permission.CAMERA) || !has(Manifest.permission.ACCESS_FINE_LOCATION)) {
                      requestPermissions(new String[]{
                              Manifest.permission.CAMERA,
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION}, REQ);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (bridge != null) bridge.start();
                  if (pendingCam != null) {
                      if (has(Manifest.permission.CAMERA)) pendingCam.grant(pendingCam.getResources());
                      else pendingCam.deny();
                      pendingCam = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, android.content.Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 7 && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (bridge != null) bridge.start();
              }

              @Override
              protected void onPause() {
                  if (bridge != null) bridge.stop();
                  super.onPause();
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          ARELEC_EOF
      - name: Write app/src/main/java/com/arelec/app/NativeBridge.java
        run: |
          mkdir -p app/src/main/java/com/arelec/app
          cat > app/src/main/java/com/arelec/app/NativeBridge.java <<'ARELEC_EOF'
          package com.arelec.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.location.GnssStatus;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.SizeF;
          import android.webkit.WebView;

          /**
           * Gives the web app what the WebView alone cannot:
           *  - raw satellite GPS fixes (GPS_PROVIDER, 2 per second) with the number of satellites used and dual-frequency (L5) status;
           *  - the real field of view of the back camera (focal length / sensor size), so the 3D walls line up with the image.
           */
          final class NativeBridge implements LocationListener {
              private final Activity act;
              private final WebView web;
              private final LocationManager lm;
              private final Handler main = new Handler(Looper.getMainLooper());
              private boolean running;
              private int total, used;
              private boolean dual;
              private GnssStatus.Callback gnssCb;

              NativeBridge(Activity act, WebView web) {
                  this.act = act;
                  this.web = web;
                  this.lm = (LocationManager) act.getSystemService(Context.LOCATION_SERVICE);
              }

              void start() {
                  if (running || lm == null) return;
                  if (act.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) return;
                  try {
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500L, 0f, this, Looper.getMainLooper());
                      gnssCb = new GnssStatus.Callback() {
                          @Override
                          public void onSatelliteStatusChanged(GnssStatus st) {
                              int n = st.getSatelliteCount(), u = 0;
                              boolean l5 = false;
                              for (int i = 0; i < n; i++) {
                                  if (!st.usedInFix(i)) continue;
                                  u++;
                                  if (Build.VERSION.SDK_INT >= 26 && st.hasCarrierFrequencyHz(i) && st.getCarrierFrequencyHz(i) < 1.3e9f) l5 = true;
                              }
                              total = n;
                              used = u;
                              dual = l5;
                          }
                      };
                      lm.registerGnssStatusCallback(gnssCb, main);
                      running = true;
                  } catch (SecurityException | IllegalArgumentException e) {
                      running = false;
                  }
              }

              void stop() {
                  if (!running) return;
                  try {
                      lm.removeUpdates(this);
                      if (gnssCb != null) lm.unregisterGnssStatusCallback(gnssCb);
                  } catch (Exception ignored) {
                  }
                  running = false;
              }

              private void js(final String code) {
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          web.evaluateJavascript(code, null);
                      }
                  });
              }

              @Override
              public void onLocationChanged(Location l) {
                  double acc = l.hasAccuracy() ? l.getAccuracy() : 99.0;
                  double alt = l.hasAltitude() ? l.getAltitude() : 0.0;
                  js("window.__nativeGnss&&window.__nativeGnss(" + l.getLatitude() + "," + l.getLongitude() + "," + acc + "," + alt + ","
                          + used + "," + total + "," + (dual ? 1 : 0) + ")");
              }

              @Override
              public void onStatusChanged(String provider, int status, Bundle extras) {
              }

              @Override
              public void onProviderEnabled(String provider) {
              }

              @Override
              public void onProviderDisabled(String provider) {
              }

              /** Long-side field of view of the main back camera, in degrees. */
              void sendCamera() {
                  try {
                      CameraManager cm = (CameraManager) act.getSystemService(Context.CAMERA_SERVICE);
                      if (cm == null) return;
                      for (String id : cm.getCameraIdList()) {
                          CameraCharacteristics c = cm.getCameraCharacteristics(id);
                          Integer facing = c.get(CameraCharacteristics.LENS_FACING);
                          if (facing == null || facing != CameraCharacteristics.LENS_FACING_BACK) continue;
                          float[] fl = c.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS);
                          SizeF sz = c.get(CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE);
                          if (fl == null || fl.length == 0 || sz == null || fl[0] <= 0) continue;
                          double longSide = Math.max(sz.getWidth(), sz.getHeight());
                          double fov = Math.toDegrees(2 * Math.atan(longSide / (2 * fl[0])));
                          js("window.__nativeCam&&window.__nativeCam(" + fov + "," + fl[0] + ")");
                          return;
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          ARELEC_EOF
      - name: Bundle web app and three.js into the APK
        run: |
          mkdir -p app/src/main/assets
          cp /tmp/web/index.html /tmp/web/scan-test.html app/src/main/assets/
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/src/main/assets/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' app/src/main/assets/*.html
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ar-elec-apk
          path: app/build/outputs/apk/debug/app-debug.apk
