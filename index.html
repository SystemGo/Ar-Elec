<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Elec Prototype</title>

<style>
/* Layout: full-screen 3D. Top-left: menu button + properties card. Bottom: step dots + status line. Everything else lives in the slide-in menu. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f2f2f7; --line:#e5e5ea; --fg:#1c1c1e; --muted:#8e8e93;
  --accent:#5856d6; --accent-ink:#ffffff; --accent-soft:#ecebfc;
  --ok:#34c759; --warn:#d99a00; --bad:#ff3b30;
  --view-bg:#f7f7fa; --wall:#f4f4f6; --floor:#ffffff; --grid:#e3e3ea; --plan-ink:#5856d6;
  --f-display:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:#38383a; --fg:#f2f2f7; --muted:#8e8e93;
  --accent:#7d7aff; --accent-ink:#ffffff; --accent-soft:#2b2a52; --ok:#30d158; --warn:#ffd60a; --bad:#ff453a;
  --view-bg:#111114; --wall:#3a3a3c; --floor:#1c1c1e; --grid:#2c2c2e; --plan-ink:#7d7aff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:#38383a; --fg:#f2f2f7; --muted:#8e8e93;
  --accent:#7d7aff; --accent-ink:#ffffff; --accent-soft:#2b2a52; --ok:#30d158; --warn:#ffd60a; --bad:#ff453a;
  --view-bg:#111114; --wall:#3a3a3c; --floor:#1c1c1e; --grid:#2c2c2e; --plan-ink:#7d7aff; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--view-bg);color:var(--fg);font-family:var(--f-display);font-size:14px;line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:auto;user-select:auto}
[hidden]{display:none!important}
#c3d,#plan{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.float{position:fixed;z-index:10;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.16)}
#menuBtn{top:calc(12px + var(--st));left:calc(12px + var(--sl));width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--fg)}
.ic{width:1.1em;height:1.1em;flex:none;display:block}
#menuBtn .ic,.tb .ic{width:20px;height:20px}
.tr{position:fixed;z-index:12;top:calc(12px + var(--st));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.tb{position:static;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--fg)}
.tb[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pop{top:calc(60px + var(--st));right:calc(12px + env(safe-area-inset-right,0px));z-index:13;border-radius:12px;min-width:210px;padding:6px;display:flex;flex-direction:column;gap:2px}
.pop h3{padding:6px 10px 4px}
.pop button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:transparent;border-radius:8px;font:600 14px var(--f-display);color:var(--fg);text-align:left;cursor:pointer}
.pop button .ic{color:var(--muted)}
.pop button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pop button[aria-pressed="true"] .ic{color:var(--accent)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#stepTag .ic{color:var(--accent)}#stepTag{cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px}
.btn.wide{width:100%}
#stepTag{top:calc(12px + var(--st));left:calc(60px + var(--sl));height:40px;border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;max-width:calc(100vw - 196px);white-space:nowrap;overflow:hidden}
#stepTag b{font-family:var(--f-mono);color:var(--accent)}
#props{top:calc(60px + var(--st));left:calc(12px + var(--sl));width:min(320px,calc(100vw - 24px));max-height:calc(100% - 66px - 120px - var(--st) - var(--sb));overflow:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
#props .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
#props .ph h3{flex:1}
#props .pb{padding:12px;display:flex;flex-direction:column;gap:10px}
#props.min .pb{display:none}#props.min .ph{border-bottom:0}
.icon .ic{width:18px;height:18px}
.icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:600 15px var(--f-mono);cursor:pointer;display:grid;place-items:center;padding:0}
#status{left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(104px + var(--sb));border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);font:12px var(--f-mono);color:var(--muted)}
#status.live{color:var(--fg);border-color:var(--accent)}
#status .btn{padding:6px 10px;font-size:12px}
.fab{z-index:11;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--fg)}
#scanBtn{left:0;right:0;margin-inline:auto;bottom:calc(16px + var(--sb));width:60px;height:60px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);color:var(--accent-ink);box-shadow:0 6px 22px rgba(0,0,0,.28)}
#scanBtn .ic{width:26px;height:26px}
#scanBtn.cap{background:var(--accent)}
#scanBtn.on{background:var(--bad)}
#scanBtn.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--bad);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
#nextBtn{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(22px + var(--sb));height:44px;border-radius:12px;padding:0 12px 0 14px;font:700 14px var(--f-display);background:var(--fg);color:var(--bg);border-color:var(--fg)}
#nextBtn .ic,#doneBtn .ic{width:18px;height:18px}
#camVid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
#c3d{z-index:1}#plan{z-index:2}
#liveHud{top:calc(12px + var(--st));left:0;right:0;margin-inline:auto;width:fit-content;max-width:calc(100vw - 24px);border-radius:999px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font:11px var(--f-mono)}
.src{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted);padding:0}
.src .ic{width:16px;height:16px}
.src.on{background:var(--ok);border-color:var(--ok);color:#fff}
.src.weak{border-color:var(--warn);color:var(--warn)}
.src.off{opacity:.6}
@media (prefers-reduced-motion:reduce){#scanBtn.on::after{animation:none}}
body.surveying #status{top:calc(60px + var(--st));bottom:auto}
#lineCv{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.src.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.mini.act{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#svTools{position:fixed;z-index:11;left:calc(12px + var(--sl));bottom:calc(16px + var(--sb));display:flex;flex-direction:column;gap:8px}
.mini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;padding:0;cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--fg);box-shadow:0 4px 16px rgba(0,0,0,.16)}
.mini .ic{width:18px;height:18px}.mini:disabled{opacity:.4}.mini.rec{background:var(--bad);border-color:var(--bad);color:#fff}
#doneBtn{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(22px + var(--sb));height:44px;border-radius:12px;padding:0 14px;font:700 14px var(--f-display);background:var(--fg);color:var(--bg);border-color:var(--fg)}
#svRead{left:0;right:0;margin-inline:auto;width:fit-content;max-width:calc(100vw - 140px);bottom:calc(88px + var(--sb));border-radius:999px;padding:6px 12px;font:600 12px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);padding:0;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px var(--f-display);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb em{position:absolute;right:4px;bottom:4px;font:600 10px var(--f-mono);background:rgba(0,0,0,.6);color:#fff;padding:1px 4px;border-radius:4px;font-style:normal}
#viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}
#viewer .vbox{max-width:100%;display:flex;flex-direction:column;gap:10px}
#viewer img,#viewer video{max-width:100%;max-height:70vh;border-radius:8px}#viewer .note{color:#ccc}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.38);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;z-index:21;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--surface);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb)}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex:1}
.brand i{width:11px;height:11px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.brand small{font:400 10px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.dbody{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{margin:0;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:600 13px var(--f-display);border:0;background:transparent;color:var(--muted);padding:10px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{font:600 13px var(--f-display);border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools .btn{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 8px;gap:6px;font-size:12.5px}
.tools .btn .ic{width:22px;height:22px}
.tools .btn.primary .ic{color:inherit}
label.f .lt{display:flex;align-items:center;gap:5px}label.f .lt .ic{width:15px;height:15px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:110px}
input[type=number],select{font:500 16px var(--f-mono);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);width:100%}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette button{display:flex;align-items:center;gap:8px;font:600 12px var(--f-display);padding:10px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--fg);cursor:pointer;text-align:left}
.palette button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.palette small{display:block;font:400 11px var(--f-mono);color:var(--muted)}
.sw{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff}.sw .ic{width:16px;height:16px}
.chip{font:600 11px var(--f-mono);padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th{font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line)}
td.n{font-family:var(--f-mono);text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.msgs{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.msgs li{font-size:12px;padding:6px 8px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--ok)}
.msgs li.warn{border-left-color:var(--warn)}.msgs li.bad{border-left-color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--f-mono);text-align:right}
#scanBox{left:12px;right:12px;bottom:calc(160px + var(--sb));border-radius:10px;padding:10px 12px;font:12px var(--f-mono);border-color:var(--accent)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);width:0}
.note{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}

body{font-feature-settings:"tnum" 1;letter-spacing:-.005em}

#menuBtn,.tb{width:44px;height:44px;border-radius:50%}

.gl{background:var(--surface);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;border:0;background:transparent;font:400 15px var(--f-display);color:var(--fg);text-align:left;cursor:pointer;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.li>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li em{font-style:normal;color:var(--muted);font-size:15px;white-space:nowrap}
.li>.ic{width:20px;height:20px;color:var(--accent)}
.li>.ic:last-child{width:16px;height:16px;color:var(--muted)}
.li.danger,.li.danger>.ic{color:var(--bad)}
.li input{width:110px;text-align:right;border:0;background:transparent;color:var(--muted);font:400 15px var(--f-display);padding:8px 0}
.li input[type=text]{width:60%}
.li .sw{width:28px;height:28px;border-radius:7px}
.li .dot{width:10px;height:10px;border-radius:50%;margin:0}
.li .dot.bad{background:var(--bad)}.li .dot.warn{background:var(--warn)}
.grp .gal{padding:10px;grid-template-columns:repeat(4,1fr)}
.thumb.add{border:1.5px dashed var(--line);background:transparent;color:var(--accent)}
.thumb.add .ic{width:22px;height:22px}
.grp textarea{width:100%;border:0;background:transparent;padding:12px 14px;font:400 15px var(--f-display);color:var(--fg);resize:vertical;min-height:70px}
#sheet{left:0;right:0;bottom:0;border-radius:20px 20px 0 0;padding:14px 18px calc(12px + var(--sb));z-index:9;box-shadow:0 -2px 16px rgba(0,0,0,.08)}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.shh b{font-size:18px;font-weight:700;color:var(--accent)}
#pjInfo{background:transparent;color:var(--accent)}#pjInfo .ic{width:22px;height:22px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stats span{display:block;font:500 10px var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.stats b{display:block;font:600 14px var(--f-display);color:var(--fg);white-space:nowrap}
body:not(.surveying) #scanBtn{bottom:calc(var(--sheetH) + 14px + var(--sb))}
body:not(.surveying) #nextBtn{bottom:calc(var(--sheetH) + 22px + var(--sb))}
body:not(.surveying) #status{bottom:calc(var(--sheetH) + 92px + var(--sb))}
body.surveying #sheet{display:none}
#props{max-height:calc(100% - 64px - var(--sheetH) - 110px - var(--st) - var(--sb))}
#startOv{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;background:rgba(0,0,0,.25)}
#startOv div{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;font:500 15px var(--f-display);text-shadow:0 1px 3px rgba(0,0,0,.5)}
#startOv svg{width:150px;height:auto;animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){#startOv svg{animation:none}}
/* ---- start screen + AR device bar ---- */
#home{position:fixed;inset:0;z-index:9;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(24px + var(--sb))}
body:not(.home) #home{display:none}
body.home #stepTag,body.home .tr,body.home #scanBtn,body.home #nextBtn,body.home #sheet,body.home #props,body.home #c3d,body.home #plan{display:none!important}
.hm{width:min(420px,100%);display:flex;flex-direction:column;gap:18px;align-items:stretch;text-align:center}
.hm h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.hm .stats{background:var(--surface);border-radius:16px;padding:14px 8px}
.hmGo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{aspect-ratio:1;border:0;border-radius:22px;background:var(--surface);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 17px var(--f-display);cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.tile .ic{width:44px;height:44px;color:var(--accent)}
.tile.primary{background:var(--accent);color:var(--accent-ink)}.tile.primary .ic{color:var(--accent-ink)}
.tile:disabled{opacity:.4}
.hmPlan{align-self:center;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--accent);font:600 15px var(--f-display);padding:10px 16px;cursor:pointer}
.hmPlan .ic{width:20px;height:20px}
#devBar{left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(88px + var(--sb));border-radius:999px;padding:4px;display:flex;gap:2px}
#devBar button{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:9px 14px;font:600 13px var(--f-display);color:var(--fg);cursor:pointer}
#devBar button .ic{width:18px;height:18px}
#devBar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
body.devbar #svRead{bottom:calc(140px + var(--sb))}
#stepTag .ic{display:block!important;width:18px;height:18px;color:var(--accent)}
/* ---- projects page ---- */
#home{place-items:start center;overflow-y:auto;padding-top:calc(72px + var(--st))}
.hm{gap:14px;text-align:left}
.hm h1{font-size:22px;margin:10px 4px 0}
.hmGo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hmGo .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 10px;border-radius:14px;font:600 15px var(--f-display)}
.hmGo .btn .ic{width:20px;height:20px}
.hmGo .btn:disabled{opacity:.45}
#pjList .li{min-height:62px}
#pjList .li span b{display:block;font-weight:600}
#pjList .li span small{display:block;font-size:13px;color:var(--muted)}
#pjList .cur{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
#pjList .nocur{width:8px;flex:none}
.pjEmpty{padding:18px 14px;color:var(--muted);font-size:15px}
#pjSheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.pjs{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--sb));display:flex;flex-direction:column;gap:6px}
.pjs h2{margin:0 4px}.pjs .note{margin:0 4px 8px;font-size:13px}
</style>
</head>

<button class="float fab" id="nextBtn" aria-label="Next step"><span id="nextLbl">Next</span></button>
<div class="float" id="liveHud" hidden></div>
<canvas id="lineCv" aria-hidden="true"></canvas>
<div id="svTools" hidden></div>

  if(aim.visible){const a=T(aim.position.x,aim.position.z);g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.arc(a[0],a[1],4,0,7);g.stroke();}
  const me=T(L.pos.x,L.pos.z),yw=new THREE.Euler().setFromQuaternion(cam.quaternion,'YXZ').y,fx=-Math.sin(yw),fz=-Math.cos(yw);
  g.fillStyle='#7d7aff';g.beginPath();g.moveTo(me[0]+fx*7,me[1]+fz*7);g.lineTo(me[0]-fz*4-fx*3,me[1]+fx*4-fz*3);g.lineTo(me[0]+fz*4-fx*3,me[1]-fx*4-fz*3);g.closePath();g.fill();}
const PH={low:['arrow-collapse-down','Set low point'],high:['arrow-collapse-up','Set high point'],corner:['plus','Add corner'],align:['target','Align on this corner'],place:['plus','Place device']};
function svPhase(){return S.phase==='locate'?(S.alignMode?'align':'place'):S.phase==='height'?(S.low?'high':'low'):'corner';}
function svPrimary(){const p=svPhase();if(p==='low')setLow();else if(p==='high')setHigh();else if(p==='align'){alignCorner();S.alignMode=false;svUI();}else if(p==='place')placeDevice();else addCorner();}
// AR view: the device goes on the wall in the middle of the screen, at its standard height
function wallTarget(){castAt(innerWidth/2,innerHeight/2);const h=ray.intersectObjects(gWalls.children.filter(o=>o.isMesh))[0];if(!h)return null;
  const i=h.object.userData.wall,g=wallGeo(i),P=h.point;let t=((P.x-g.ax)*g.ux+(P.z-g.ay)*g.uy)/g.L;t=Math.min(0.98,Math.max(0.02,t));
  const side=((cam.position.x-g.mx)*g.nx+(cam.position.z-g.my)*g.ny)>=0?1:-1;return{wall:i,t,side,dist:h.distance};}
function placeDevice(){const w=wallTarget();if(!w){flash('Aim at a wall');return;}const type=S.devType;
  if(type==='panel'){const old=devs.find(d=>d.type==='panel');if(old)Object.assign(old,{wall:w.wall,t:w.t,side:w.side});else{const d={id:uid++,type,wall:w.wall,t:w.t,h:TYPES.panel.h,side:w.side};devs.push(d);S.placed.push(d.id);}
    S.devType='socket';flash('Panel placed');}
  else{const d={id:uid++,type,wall:w.wall,t:w.t,h:TYPES[type].h,side:w.side};devs.push(d);S.placed.push(d.id);flash(`${TYPES[type].label} · ${d.h.toFixed(2)} m`);}
  save();build();svUI();}
const devAim=new THREE.Group();(()=>{const disc=new THREE.Mesh(new THREE.CircleGeometry(0.07,32),new THREE.MeshBasicMaterial({color:0x6e6cf0,transparent:true,opacity:.6,depthTest:false,side:THREE.DoubleSide}));
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.07,0.082,32),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false,transparent:true,side:THREE.DoubleSide}));
  const dot=new THREE.Mesh(new THREE.CircleGeometry(0.012,16),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false,transparent:true,side:THREE.DoubleSide}));
  [disc,ring,dot].forEach(m=>{m.renderOrder=12;devAim.add(m);});devAim.visible=false;world.add(devAim);})();
function devAimTick(){const w=S&&S.phase==='locate'&&!S.alignMode?wallTarget():null;if(!w){devAim.visible=false;return null;}
  const g=wallGeo(w.wall),h=TYPES[S.devType].h,off=plan.thick/2+0.02,x=g.ax+g.dx*w.t+g.nx*w.side*off,z=g.ay+g.dy*w.t+g.ny*w.side*off;
  devAim.position.set(x,h,z);devAim.lookAt(x+g.nx*w.side,h,z+g.ny*w.side);devAim.visible=true;return w;}
function svUI(){const b=$('scanBtn');window.__survey=!!S;
  const show=!!S;['doneBtn','svMenuBtn','svRead'].forEach(id=>$(id).hidden=!show);$('miniMap').hidden=true;if(!show){$('svPop').hidden=true;$('svMenuBtn').setAttribute('aria-expanded','false');}
  if(!S){b.classList.remove('cap');$('devBar').hidden=true;document.body.classList.remove('devbar');if(typeof devAim!=='undefined')devAim.visible=false;return;}
  let p=S.modify&&svPhase()==='corner'?['pencil-outline','Move the last corner here']:PH[svPhase()];b.classList.remove('on');b.classList.add('cap');b.innerHTML=ic(p[0]);b.setAttribute('aria-label',p[1]);
  const loc=S.phase==='locate';const db=$('devBar');db.hidden=!loc||S.alignMode;document.body.classList.toggle('devbar',!db.hidden);
  if(loc){const opts=devs.some(d=>d.type==='panel')?['socket','switch','light']:['panel'];if(!opts.includes(S.devType))S.devType=opts[0];
    db.innerHTML=opts.map(k=>`<button data-dt="${k}" aria-pressed="${S.devType===k}">${ic(TYPES[k].ic)}<span>${k==='panel'?'Panel':TYPES[k].label.replace(' 2P+T','').replace('Light switch','Switch').replace('Wall light','Light')}</span></button>`).join('');
    db.querySelectorAll('[data-dt]').forEach(x=>x.onclick=()=>{S.devType=x.dataset.dt;svUI();});
    if(svPhase()==='place')p=[TYPES[S.devType].ic,'Place '+TYPES[S.devType].label];b.innerHTML=ic(p[0]);b.setAttribute('aria-label',p[1]);}
  const items=loc?[['svUndoDev','undo','Undo',!S.placed.length,false],['svAlign','target','Align on a corner',false,!!S.alignMode],['svGps','crosshairs-gps','Re-locate from GPS',!plan.geoFrame,false],['svAssist','magnet','Line assist',false,S.assist]]
    :[['svUndo','undo','Undo',!S.chain.length,false],['svMod','pencil-outline','Modify last corner',!S.chain.length,!!S.modify],['svClose','vector-square-close','Close room',S.chain.length<3,false],['svAssist','magnet','Line assist',false,S.assist]];
  $('svPop').innerHTML=items.map(([id,i,l,dis,pr])=>`<button id="${id}" role="menuitem" ${dis?'disabled':''} aria-pressed="${pr}">${ic(i)}${l}</button>`).join('');
  const done=()=>{$('svPop').hidden=true;$('svMenuBtn').setAttribute('aria-expanded','false');};
  on('svUndo','click',()=>{S.modify=false;undoCorner();done();});
  on('svUndoDev','click',()=>{const id=S.placed.pop();devs=devs.filter(d=>d.id!==id);if(!devs.some(d=>d.type==='panel'))S.devType='panel';save();build();svUI();done();});
  on('svAlign','click',()=>{S.alignMode=!S.alignMode;svUI();done();flash(S.alignMode?'Aim at a corner':'');});on('svClose','click',()=>{closeRoom();done();});
  on('svMod','click',()=>{S.modify=!S.modify;svUI();done();flash(S.modify?'Modify':'');});
  on('svAssist','click',()=>{S.assist=!S.assist;svUI();done();flash(S.assist?'Line assist on':'Line assist off');});
  on('svGps','click',()=>{done();if(L.geo&&!L.geo.err){S.align=null;applyFix(L.geo);}else{S.needFix=true;flash('Waiting for GPS…');}});}
$('svMenuBtn').innerHTML=ic('menu');$('svMenuBtn').addEventListener('click',e=>{e.stopPropagation();const o=$('svPop').hidden;$('svPop').hidden=!o;$('svMenuBtn').setAttribute('aria-expanded',o);});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#svPop,#svMenuBtn')){$('svPop').hidden=true;$('svMenuBtn').setAttribute('aria-expanded','false');}},true);
$('doneBtn').innerHTML=ic('chevron-right');$('doneBtn').addEventListener('click',()=>finishSurvey());

// ---- gallery (menu) ----
async function renderGallery(){const el=$('gallery');if(!el)return;let all=[];try{all=await mAll();}catch(_){}
  el.innerHTML='';const add=document.createElement('button');add.className='thumb add';add.setAttribute('aria-label','Add photo');add.innerHTML=ic('plus');add.onclick=()=>{const f=$('fPhoto');if(f)f.click();};el.appendChild(add);all.slice().reverse().forEach(m=>{const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label',m.type+' '+new Date(m.t).toLocaleString());
    if(m.type==='photo'){const i=document.createElement('img');i.src=URL.createObjectURL(m.blob);b.appendChild(i);}else{b.innerHTML=ic('play-circle-outline')+'<span>Video</span>';}
    if(m.wall!=null)b.insertAdjacentHTML('beforeend',`<em>W${m.wall+1}</em>`);b.onclick=()=>openViewer(m);el.appendChild(b);});}
function openViewer(m){const v=$('viewer');const url=URL.createObjectURL(m.blob);const g=m.gps?`${m.gps.lat.toFixed(6)}, ${m.gps.lon.toFixed(6)} ±${Math.round(m.gps.acc)} m`:'no GPS';
  v.innerHTML=`<div class="vbox">${m.type==='photo'?`<img src="${url}" alt="Site photo">`:`<video src="${url}" controls playsinline></video>`}
   <p class="note">${new Date(m.t).toLocaleString()} · position ${m.pose?m.pose.x.toFixed(1)+', '+m.pose.z.toFixed(1)+' m':'–'} · ${g}${m.wall!=null?' · wall '+(m.wall+1):''}</p>
   <div class="row"><button class="btn danger" id="vDel">${ic('trash-can-outline')}Delete</button><button class="btn primary" id="vClose">${ic('close')}Close</button></div></div>`;
  v.hidden=false;$('vClose').onclick=()=>{v.hidden=true;v.innerHTML='';};
  $('vDel').onclick=async()=>{await mDel(m.id);if(plan.wallTex)for(const k in plan.wallTex)if(plan.wallTex[k]===m.id)delete plan.wallTex[k];delete texCache[m.id];save();build();v.hidden=true;v.innerHTML='';renderGallery();};}

$('nextBtn').insertAdjacentHTML('beforeend',ic('arrow-right'));
$('hmNew').innerHTML=ic('plus')+'<span>New project</span>';$('hmAR').innerHTML=ic('video-3d')+'<span>AR view</span>';
$('hmNew').onclick=()=>newProject();$('pjSheet').addEventListener('click',e=>{if(e.target.id==='pjSheet')$('pjSheet').hidden=true;});$('hmAR').onclick=()=>{startLocate().catch(e=>{flash('Camera failed: '+(e&&e.message||e));if(S)finishSurvey();});};
paintIcons();size();setCam(true);themeScene();refresh();goHome();renderer.setAnimationLoop(loop);
})();
