<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Elec Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-screen 3D. Top-left: menu button + properties card. Bottom: step dots + status line. Everything else lives in the slide-in menu. */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface-2:#f5f6f4; --line:#d5d9d4; --fg:#1b211f; --muted:#5d6763;
  --accent:#b8621b; --accent-ink:#ffffff; --accent-soft:#f6e6d6;
  --ok:#2f7d4c; --warn:#b07a00; --bad:#b3362c;
  --view-bg:#e3e7e3; --wall:#fbfbf8; --floor:#d3d8d2; --grid:#b9c0b9; --plan-ink:#26302c;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1d; --surface-2:#202624; --line:#303835; --fg:#e7ebe8; --muted:#97a29d;
  --accent:#e08a43; --accent-ink:#1a1209; --accent-soft:#3a2a1b; --ok:#5cc184; --warn:#e2b23e; --bad:#ef6b5f;
  --view-bg:#171c1a; --wall:#3a423f; --floor:#232a27; --grid:#34403b; --plan-ink:#dfe5e1; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1d; --surface-2:#202624; --line:#303835; --fg:#e7ebe8; --muted:#97a29d;
  --accent:#e08a43; --accent-ink:#1a1209; --accent-soft:#3a2a1b; --ok:#5cc184; --warn:#e2b23e; --bad:#ef6b5f;
  --view-bg:#171c1a; --wall:#3a423f; --floor:#232a27; --grid:#34403b; --plan-ink:#dfe5e1; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--view-bg);color:var(--fg);font-family:var(--f-display);font-size:14px;line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:auto;user-select:auto}
[hidden]{display:none!important}
#c3d,#plan{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.float{position:fixed;z-index:10;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.16)}
#menuBtn{top:calc(12px + var(--st));left:calc(12px + var(--sl));width:46px;height:46px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--fg)}
.ic{width:1.3em;height:1.3em;flex:none;display:block}
#menuBtn .ic,.tb .ic{width:24px;height:24px}
.tr{position:fixed;z-index:12;top:calc(12px + var(--st));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.tb{position:static;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--fg)}
.tb[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pop{top:calc(66px + var(--st));right:calc(12px + env(safe-area-inset-right,0px));z-index:13;border-radius:12px;min-width:210px;padding:6px;display:flex;flex-direction:column;gap:2px}
.pop h3{padding:6px 10px 4px}
.pop button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:transparent;border-radius:8px;font:600 14px var(--f-display);color:var(--fg);text-align:left;cursor:pointer}
.pop button .ic{color:var(--muted)}
.pop button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pop button[aria-pressed="true"] .ic{color:var(--accent)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#stepTag .ic{color:var(--accent)}#stepTag{cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px}
.btn.wide{width:100%}
#stepTag{top:calc(12px + var(--st));left:calc(66px + var(--sl));height:46px;border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;max-width:calc(100vw - 196px);white-space:nowrap;overflow:hidden}
#stepTag b{font-family:var(--f-mono);color:var(--accent)}
#props{top:calc(66px + var(--st));left:calc(12px + var(--sl));width:min(320px,calc(100vw - 24px));max-height:calc(100% - 66px - 120px - var(--st) - var(--sb));overflow:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
#props .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
#props .ph h3{flex:1}
#props .pb{padding:12px;display:flex;flex-direction:column;gap:10px}
#props.min .pb{display:none}#props.min .ph{border-bottom:0}
.icon .ic{width:18px;height:18px}
.icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:600 15px var(--f-mono);cursor:pointer;display:grid;place-items:center;padding:0}
#status{left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(104px + var(--sb));border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);font:12px var(--f-mono);color:var(--muted)}
#status.live{color:var(--fg);border-color:var(--accent)}
#status .btn{padding:6px 10px;font-size:12px}
.fab{z-index:11;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--fg)}
#scanBtn{left:0;right:0;margin-inline:auto;bottom:calc(16px + var(--sb));width:72px;height:72px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);color:var(--accent-ink);box-shadow:0 6px 22px rgba(0,0,0,.28)}
#scanBtn .ic{width:34px;height:34px}
#scanBtn.on{background:var(--bad)}
#scanBtn.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--bad);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
#nextBtn{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(26px + var(--sb));height:52px;border-radius:14px;padding:0 14px 0 16px;font:700 14px var(--f-display);background:var(--fg);color:var(--bg);border-color:var(--fg)}
#nextBtn .ic{width:22px;height:22px}
#camVid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
#c3d{z-index:1}#plan{z-index:2}
#liveHud{top:calc(66px + var(--st));left:0;right:0;margin-inline:auto;width:fit-content;max-width:calc(100vw - 24px);border-radius:12px;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font:11px var(--f-mono)}
.src{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.src.on{border-color:var(--ok);color:var(--ok)}.src.weak{border-color:var(--warn);color:var(--warn)}
.src .ic{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){#scanBtn.on::after{animation:none}}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.38);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;z-index:21;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--surface);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb)}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex:1}
.brand i{width:11px;height:11px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.brand small{font:400 10px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.dbody{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{margin:0;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:600 13px var(--f-display);border:0;background:transparent;color:var(--muted);padding:10px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{font:600 13px var(--f-display);border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools .btn{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 8px;gap:6px;font-size:12.5px}
.tools .btn .ic{width:28px;height:28px}
.tools .btn.primary .ic{color:inherit}
label.f .lt{display:flex;align-items:center;gap:5px}label.f .lt .ic{width:15px;height:15px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:110px}
input[type=number],select{font:500 16px var(--f-mono);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);width:100%}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette button{display:flex;align-items:center;gap:8px;font:600 12px var(--f-display);padding:10px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--fg);cursor:pointer;text-align:left}
.palette button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.palette small{display:block;font:400 11px var(--f-mono);color:var(--muted)}
.sw{width:30px;height:30px;flex:none;border-radius:7px;display:grid;place-items:center;color:#fff}.sw .ic{width:20px;height:20px}
.chip{font:600 11px var(--f-mono);padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th{font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line)}
td.n{font-family:var(--f-mono);text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.msgs{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.msgs li{font-size:12px;padding:6px 8px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--ok)}
.msgs li.warn{border-left-color:var(--warn)}.msgs li.bad{border-left-color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--f-mono);text-align:right}
#scanBox{left:12px;right:12px;bottom:calc(160px + var(--sb));border-radius:10px;padding:10px 12px;font:12px var(--f-mono);border-color:var(--accent)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);width:0}
.note{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}
</style>
</head>
<body>
<video id="camVid" playsinline muted autoplay hidden></video>
<canvas id="c3d"></canvas>
<svg id="plan" hidden></svg>

<button class="float" id="menuBtn" aria-label="Open menu" aria-expanded="false" data-ic="menu"></button>
<div class="float" id="stepTag"><span id="stepIc"></span><b id="stepNum">1</b><span id="stepName">Plan &amp; 3D</span></div>
<div class="tr">
  <button class="float tb" id="viewBtn" aria-label="View menu" aria-expanded="false" aria-controls="viewPop"></button>
  <button class="float tb" id="camBtn" aria-label="Camera menu" aria-expanded="false" aria-controls="camPop"></button>
</div>
<div class="float pop" id="viewPop" hidden role="menu" aria-label="View">
  <h3>View</h3>
  <button id="v2d" data-ic="floor-plan"><span>2D plan</span></button>
  <button id="v3d" data-ic="cube-outline"><span>3D model</span></button>
  <hr><button id="xray" data-ic="square-opacity"><span>X-ray walls</span></button>
</div>
<div class="float pop" id="camPop" hidden role="menu" aria-label="Camera">
  <h3>Camera</h3>
  <button id="camFps" data-ic="walk"><span>FPS · walk</span></button>
  <button id="camFree" data-ic="rotate-orbit"><span>Free camera</span></button>
  <hr><button id="resetCam" data-ic="restore"><span>Reset view</span></button>
</div>
<section class="float" id="props" hidden aria-label="Properties"></section>
<div class="float" id="status" role="status"></div>
<div class="float" id="scanBox" hidden><span id="scanTxt">Scanning…</span><div class="bar"><div id="scanBar"></div></div></div>
<button class="float fab" id="scanBtn" aria-label="Start live camera scan" data-ic="cube-scan"></button>
<button class="float fab" id="nextBtn" aria-label="Next step"><span id="nextLbl">Next</span></button>
<div class="float" id="liveHud" hidden></div>

<div id="scrim"></div>
<aside id="drawer" aria-label="Menu" aria-hidden="true">
  <div class="dh"><div class="brand"><i></i>AR Elec <small>NF C 15-100</small></div><button class="icon" id="menuClose" aria-label="Close menu" data-ic="close"></button></div>
  <div class="dbody">
    <div id="stepBody"></div>
    <div class="sec"><a class="btn wide" href="scan-test.html" style="text-decoration:none" data-ic="cellphone-arrow-down"><span>Sensor &amp; scan test</span></a></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
// ---------- Model ----------
const TYPES={
  panel:  {ic:'fuse',label:'Electrical panel',short:'TAB',h:1.30,kind:null,  plate:[0.46,0.60,0.12],col:'#d9dcd6'},
  socket: {ic:'power-socket-fr',label:'Socket 2P+T',     short:'PC', h:0.30,kind:'power',plate:[0.085,0.085,0.02],col:'#f2f0ea'},
  socket2:{ic:'power-socket-eu',label:'Double socket',   short:'PC2',h:0.30,kind:'power',plate:[0.16,0.085,0.02],col:'#f2f0ea'},
  switch: {ic:'light-switch',label:'Light switch',    short:'INT',h:1.10,kind:'light',plate:[0.085,0.085,0.02],col:'#f2f0ea'},
  light:  {ic:'wall-sconce-flat-variant-outline',label:'Wall light',      short:'APP',h:2.00,kind:'light',plate:[0.14,0.09,0.06],col:'#fff1cc'},
  rj45:   {ic:'ethernet',label:'RJ45 data',       short:'RJ', h:0.30,kind:'data', plate:[0.085,0.085,0.02],col:'#e5e8ee'},
};
const KIND={
  power:{name:'Sockets',  sec:'2,5 mm²',brk:'20 A',max:12,cols:['#8a4b22','#b36a2e','#6e3a1a','#c98a4b']},
  light:{name:'Lighting', sec:'1,5 mm²',brk:'16 A',max:8, cols:['#d98a1a','#e8b13a','#c26a12']},
  data: {name:'Data VDI', sec:'Cat 6',  brk:'—',   max:99,cols:['#5b5fc7']},
};
const SAMPLE={height:2.5,thick:0.15,walls:[[[0,0],[7,0]],[[7,0],[7,5]],[[7,5],[0,5]],[[0,5],[0,0]],[[4,0],[4,3.6]]]};
const SAMPLE_DEV=[
  ['panel',3,0.18,1.30,1],['socket',0,0.15,0.30,1],['socket2',0,0.45,0.30,1],['rj45',0,0.50,0.30,1],
  ['socket',1,0.30,0.30,-1],['socket',1,0.75,0.30,-1],['socket2',2,0.25,0.30,1],['socket',2,0.70,0.30,1],
  ['switch',3,0.32,1.10,1],['switch',4,0.95,1.10,1],['light',2,0.45,2.00,1],['light',3,0.70,2.00,1],['light',1,0.5,2.0,-1],
];
let plan, devs=[], uid=1, step=1, sel=null, tool=null, moveMode=false, xray=false, view3d=true;
function fresh(){plan=JSON.parse(JSON.stringify(SAMPLE));devs=SAMPLE_DEV.map(([type,wall,t,h,side])=>({id:uid++,type,wall,t,h,side}));}

  list.forEach(c=>{const y=plan.height-0.1-c.lane*0.045;let pts=[];let prev=devPos(panel,0.02).p;let len=0;
    c.devs.forEach(d=>{const q=devPos(d,0.02).p;const seg=[prev.clone(),new THREE.Vector3(prev.x,y,prev.z),new THREE.Vector3(q.x,y,q.z),q.clone()];
      for(let i=0;i<3;i++)len+=seg[i].distanceTo(seg[i+1]);pts.push(...seg);prev=q;});
    c.length=len*1.1; // +10 % slack for drops & boxes
    const path=new THREE.CurvePath();for(let i=0;i<pts.length-1;i++)if(pts[i].distanceTo(pts[i+1])>1e-4)path.add(new THREE.LineCurve3(pts[i],pts[i+1]));
    const tube=new THREE.Mesh(new THREE.TubeGeometry(path,Math.max(8,pts.length*6),0.011,6,false),new THREE.MeshLambertMaterial({color:c.color,emissive:new THREE.Color(c.color).multiplyScalar(0.25)}));
    gWires.add(tube);});

}
let lastRoute=null;
// ---------- Validation (simplified NF C 15-100 checks) ----------

  if(d.type==='panel'){const top=h+0.30,bot=h-0.30;if(bot<0.90||top>1.80)r.push(['bad',`Panel controls must sit between 0,90 m and 1,80 m (now ${bot.toFixed(2)}–${top.toFixed(2)} m).`]);else r.push(['ok','Panel height within 0,90–1,80 m.']);}
  if(d.type==='socket'||d.type==='socket2'||d.type==='rj45'){if(h<0.05)r.push(['bad','16 A socket axis must be at least 5 cm above floor.']);else r.push(['ok','Socket axis ≥ 5 cm.']);}

// ---------- Camera: FPS (default) and free orbit ----------
const EYE=1.6;let fps=true,yaw=0,pitch=0,fly=null;
const orb={target:new THREE.Vector3(),r:8,theta:0.6,phi:0.9};
function applyLook(){cam.rotation.order='YXZ';cam.rotation.set(pitch,yaw,0);}
function applyOrbit(){const s=Math.sin(orb.phi);cam.position.set(orb.target.x+orb.r*s*Math.sin(orb.theta),orb.target.y+orb.r*Math.cos(orb.phi),orb.target.z+orb.r*s*Math.cos(orb.theta));cam.lookAt(orb.target);}
function distToWalls(x,z){let m=1e9;plan.walls.forEach((w,i)=>{const g=wallGeo(i);let t=((x-g.ax)*g.ux+(z-g.ay)*g.uy)/g.L;t=Math.max(0,Math.min(1,t));m=Math.min(m,Math.hypot(x-(g.ax+g.dx*t),z-(g.ay+g.dy*t)));});return m;}
function blocked(x,z){return plan.walls.length>0&&distToWalls(x,z)<plan.thick/2+0.25;}
function sight(x,z,a){const fx=-Math.sin(a),fz=-Math.cos(a);let d=0.2;while(d<30&&!blocked(x+fx*d,z+fz*d))d+=0.1;return d;}
function fpsStart(){const b=bounds();let best=[b.cx,b.cy],bestYaw=0,score=-1;
  // stand where the longest clear sightline is, like stepping into the room from a corner
  for(let i=1;i<12;i++)for(let j=1;j<12;j++){const x=b.x0+b.w*i/12,z=b.y0+b.h*j/12;if(distToWalls(x,z)<0.7)continue;
    for(let k=0;k<16;k++){const a=k/16*Math.PI*2,d=sight(x,z,a);if(d>score){score=d;best=[x,z];bestYaw=a;}}}
  cam.fov=65;cam.updateProjectionMatrix();cam.position.set(best[0],EYE,best[1]);yaw=bestYaw;pitch=-0.15;applyLook();}
function orbitStart(){const b=bounds();orb.target.set(b.cx,0.8,b.cy);orb.r=Math.max(b.w,b.h,3)*1.5;orb.theta=0.35;orb.phi=0.85;cam.fov=50;cam.updateProjectionMatrix();applyOrbit();}

function setCam(isFps){fps=isFps;syncTop();resetCam();setStatus();}
function flyTo(o){fly=Object.assign({t:0},o);}
function tickFly(dt){if(!fly)return;fly.t=Math.min(1,fly.t+dt/0.6);const k=fly.t<.5?2*fly.t*fly.t:1-Math.pow(-2*fly.t+2,2)/2;

  else{orb.target.lerpVectors(fly.t0,fly.t1,k);orb.r=fly.r0+(fly.r1-fly.r0)*k;applyOrbit();}
  if(fly.t>=1)fly=null;}

  else{orb.r=Math.max(0.8,Math.min(60,orb.r/f));applyOrbit();}}

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();

const ptrs=new Map();let g0=null,gMoved=false,pinchD=0,lastTap=null,tapTimer=null,downT=0;
const dist2=()=>{const[a,b]=[...ptrs.values()];return Math.hypot(a[0]-b[0],a[1]-b[1]);};
canvas.addEventListener('pointerdown',e=>{e.preventDefault();ptrs.set(e.pointerId,[e.clientX,e.clientY]);try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===1){g0=[e.clientX,e.clientY];gMoved=false;fly=null;downT=performance.now();}
  else{gMoved=true;if(ptrs.size===2)pinchD=dist2();}});

function doubleTap(x,y){castAt(x,y);
  const h=ray.intersectObjects([...gWalls.children.filter(o=>o.isMesh),...gDevs.children,floorMesh],true)[0];if(!h)return;const P=h.point.clone();
  if(fps){let tx=P.x,tz=P.z;if(h.object!==floorMesh){const dx=cam.position.x-P.x,dz=cam.position.z-P.z,L=Math.hypot(dx,dz)||1;tx=P.x+dx/L*0.8;tz=P.z+dz/L*0.8;}
    for(let i=0;i<25&&blocked(tx,tz);i++){tx+=(cam.position.x-tx)*0.15;tz+=(cam.position.z-tz)*0.15;}
    if(blocked(tx,tz)){flash('Too close to a wall to stand there.');return;}
    if(live==='sensor'){L.pos.set(tx,EYE,tz);flash('Position corrected.');return;}if(live)return;
    flyTo({mode:'fps',p0:cam.position.clone(),p1:new THREE.Vector3(tx,EYE,tz)});}
  else flyTo({mode:'orbit',t0:orb.target.clone(),t1:P,r0:orb.r,r1:Math.min(orb.r,4)});}
// finger-friendly picking: nearest visible device within 34 px of the tap
function pickDev(x,y){const r=canvas.getBoundingClientRect();let best=null,bd=34;const walls=gWalls.children.filter(o=>o.isMesh);
  devs.forEach(d=>{const p=world.localToWorld(devPos(d).p),v=p.clone().project(cam);if(v.z>1||v.z<-1)return;
    const sx=r.left+(v.x+1)/2*r.width,sy=r.top+(1-v.y)/2*r.height,dd=Math.hypot(sx-x,sy-y);if(dd>=bd)return;
    const dir=p.clone().sub(cam.position),L=dir.length();const rc=new THREE.Raycaster(cam.position,dir.normalize(),0.01,L-0.03);
    if(!xray&&rc.intersectObjects(walls).length)return;bd=dd;best=d.id;});

function singleTap(x,y){castAt(x,y);

      const d={id:uid++,type:tool,wall:i,t,h:TYPES[tool].h,side};devs.push(d);sel=d.id;flash(`${TYPES[tool].label} added at ${d.h.toFixed(2)} m`);}

let scanPts=null,scanT=0;
function startScan(){go(1);setView(true);plan=JSON.parse(JSON.stringify(SAMPLE));devs=[];sel=null;clear(gWires);clear(gDevs);clear(gWalls);
  const pos=[];plan.walls.forEach((w,i)=>{const g=wallGeo(i);for(let k=0;k<g.L*260;k++){const t=Math.random(),y=Math.random()*plan.height,s=Math.random()<0.5?1:-1;
    pos.push(g.ax+g.dx*t+g.nx*s*plan.thick/2+(Math.random()-.5)*0.03,y,g.ay+g.dy*t+g.ny*s*plan.thick/2+(Math.random()-.5)*0.03);}});
  for(let k=0;k<2500;k++)pos.push(Math.random()*7,0,Math.random()*5);

  const arr=[];for(let i=0;i<pos.length;i+=3)arr.push([pos[i],pos[i+1],pos[i+2]]);arr.sort((a,b)=>Math.atan2(a[2]-2.5,a[0]-3.5)-Math.atan2(b[2]-2.5,b[0]-3.5));

  if(live==='xr'){h.innerHTML=src(true,'camera-outline','Camera AR')+src(L.anchored,'anchor',L.anchored?'Anchored':'Tap floor to anchor',!L.anchored);return;}
  const g=L.geo;const gt=!g?'GPS…':g.err?'GPS off':`GPS ±${Math.round(g.acc)} m`;
  h.innerHTML=src(!!L.stream,'camera-outline','Camera')+src(!!L.ori,'compass-outline',L.ori?(L.ori.abs?'Compass':'Gyro'):'No gyro',L.ori&&!L.ori.abs)
   +src(L.steps>0,'shoe-print',`${L.steps} steps`)+src(g&&!g.err,'crosshairs-gps',gt,g&&g.acc>8)
   +`<span class="src">${ic('axis-arrow')}${L.pos.x.toFixed(1)}, ${L.pos.z.toFixed(1)} m</span>`;}
function liveUI(){window.__liveMode=live;const b=$('scanBtn');b.classList.toggle('on',!!live);b.innerHTML=ic(live?'stop':'cube-scan');b.setAttribute('aria-label',live?'Stop live camera':'Start live camera scan');
  $('nextBtn').hidden=!!live||step===4;['viewBtn','camBtn','menuBtn','stepTag'].forEach(id=>$(id).hidden=!!live);hud();setStatus();}
$('scanBtn').addEventListener('click',()=>{startLive().catch(e=>{flash('Live camera failed: '+(e&&e.message||e));stopLive();});});
// in sensor mode a one-finger drag corrects the heading (compass drift)
canvas.addEventListener('pointermove',e=>{if(live==='sensor'&&ptrs.size===1&&gMoved)L.dragYaw+=(e.movementX||0)*0.004;});

$('nextBtn').insertAdjacentHTML('beforeend',ic('arrow-right'));
paintIcons();size();setCam(true);themeScene();refresh();renderer.setAnimationLoop(loop);
})();
</script>
</body>
