<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Elec Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* AR Elec — light monochrome theme. Bottom tab bar with a floating bubble in a notch; everything else is a white card, sheet or pill. */
@property --x{syntax:'<length>';inherits:true;initial-value:0px}
:root{
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#f1f1f3; --line:#e6e6e9; --fg:#111113; --muted:#8a8a90;
  --accent:#111113; --accent-ink:#ffffff; --accent-soft:#ececee;
  --ok:#1fa45a; --warn:#c98a12; --bad:#e5383b;
  --view-bg:#f7f7f8; --wall:#f3f3f4; --floor:#ffffff; --grid:#e4e4e7; --plan-ink:#111113;
  --f-display:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --f-mono:var(--f-display);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --barH:66px; --navH:calc(var(--barH) + var(--sb));
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --sh:0 2px 14px rgba(17,17,19,.08),0 1px 2px rgba(17,17,19,.05);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--view-bg);color:var(--fg);font:400 14px/1.45 var(--f-display);font-feature-settings:"tnum" 1;letter-spacing:-.005em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:auto;user-select:auto}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;display:block}
h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h3{margin:0;font:600 13px var(--f-display)}
p{margin:0;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

/* ---- canvases & camera ---- */
#c3d,#plan{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#camVid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
#c3d{z-index:1}#plan{z-index:2;background:var(--view-bg)}
#lineCv{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

/* ---- floating cards ---- */
.float{position:fixed;z-index:10;background:var(--surface);border:0;box-shadow:var(--sh)}
.tr{position:fixed;z-index:12;top:calc(12px + var(--st));right:calc(12px + var(--sr));display:flex;gap:8px}
.tb,#menuBtn,#editBtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--fg);transition:transform .25s var(--spring),background .2s,color .2s}
.tb{position:static}
.tb .ic,#menuBtn .ic,#editBtn .ic{width:21px;height:21px}
.tb[aria-expanded="true"],#editBtn[aria-pressed="true"]{background:var(--fg);color:#fff}
#menuBtn{top:calc(12px + var(--st));left:calc(12px + var(--sl))}
#editBtn{top:calc(12px + var(--st));left:calc(12px + var(--sl))}
.tb:active,#menuBtn:active,#editBtn:active,.mini:active{transform:scale(.9)}
.pop{top:calc(64px + var(--st));right:calc(12px + var(--sr));z-index:13;border-radius:18px;min-width:210px;padding:6px;display:flex;flex-direction:column;gap:2px;transform-origin:top right;animation:popIn .32s var(--ease)}
.pop h3{display:none}
.pop button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:transparent;border-radius:12px;font:500 15px var(--f-display);text-align:left;cursor:pointer}
.pop button .ic{color:var(--muted);width:20px;height:20px}
.pop button[aria-pressed="true"]{background:var(--surface-2)}
.pop button[aria-pressed="true"] .ic{color:var(--fg)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
@keyframes popUp{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- properties card ---- */
#props{top:calc(64px + var(--st));left:calc(12px + var(--sl));width:min(330px,calc(100vw - 24px));max-height:calc(100% - 64px - var(--navH) - 130px - var(--st));overflow:auto;border-radius:18px;-webkit-overflow-scrolling:touch;animation:popUp .35s var(--ease)}
#props .ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
#props .ph h3{flex:1;font-size:15px}
#props .pb{padding:14px;display:flex;flex-direction:column;gap:10px}
#props.min .pb{display:none}#props.min .ph{border-bottom:0}
.icon{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);font:600 15px var(--f-display);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .2s var(--spring)}
.icon:active{transform:scale(.88)}.icon .ic{width:18px;height:18px}

/* ---- status / flash ---- */
#status{left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(var(--navH) + 112px);border-radius:16px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);font:500 13.5px var(--f-display);color:var(--fg);animation:rise .3s var(--ease)}
#status:empty{display:none}
#status .btn{padding:8px 12px;font-size:13px}
body.surveying #status{top:calc(64px + var(--st));bottom:auto}
body.home #status{bottom:calc(var(--navH) + 24px)}

/* ---- buttons & inputs ---- */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--f-display);border:0;background:var(--surface-2);padding:12px 14px;border-radius:14px;cursor:pointer;text-align:left;transition:transform .2s var(--spring),background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--fg);color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4}
.btn.wide{width:100%;justify-content:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font:600 13px var(--f-display);border:0;background:transparent;color:var(--muted);padding:9px 8px;border-radius:9px;cursor:pointer;transition:background .25s var(--ease),color .25s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools .btn{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 8px;gap:6px;font-size:12.5px}
.tools .btn .ic{width:22px;height:22px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:110px}
label.f .lt{display:flex;align-items:center;gap:5px}label.f .lt .ic{width:15px;height:15px}
input[type=number],input[type=text],select{font:500 16px var(--f-display);padding:9px 10px;border:0;border-radius:12px;background:var(--surface-2);color:var(--fg);width:100%}
input[type=range]{width:100%;accent-color:var(--fg);height:28px}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette button{display:flex;align-items:center;gap:8px;font:600 12px var(--f-display);padding:10px 8px;border:0;border-radius:12px;background:var(--surface-2);cursor:pointer;text-align:left;transition:background .2s}
.palette button[aria-pressed="true"]{background:var(--fg);color:#fff}
.palette button[aria-pressed="true"] small{color:inherit;opacity:.75}
.palette small{display:block;font:400 11px var(--f-display);color:var(--muted)}
.sw{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff}.sw .ic{width:16px;height:16px}
.chip{font:600 12px var(--f-display);padding:3px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.chip.ok{background:#d9f5e4;color:#0c5132}.chip.warn{background:#fdf0cc;color:#5e4200}.chip.bad{background:#fde0e0;color:#8e0b21}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th{font:600 12px var(--f-display);color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line)}td.n{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.msgs{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.msgs li{font-size:12px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.msgs li.warn{background:#fdf0cc}.msgs li.bad{background:#fde0e0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:1;border:0;border-radius:12px;overflow:hidden;background:var(--surface-2);padding:0;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px var(--f-display);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb em{position:absolute;right:4px;bottom:4px;font:600 10px var(--f-display);background:rgba(0,0,0,.6);color:#fff;padding:1px 4px;border-radius:4px;font-style:normal}
.thumb.add{border:1.5px dashed var(--line);background:transparent;color:var(--fg)}
.thumb.add .ic{width:22px;height:22px}
#viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;animation:fadeIn .25s}
#viewer .vbox{max-width:100%;display:flex;flex-direction:column;gap:10px}
#viewer img,#viewer video{max-width:100%;max-height:70vh;border-radius:10px}#viewer .note{color:#ccc}

/* ---- drawer (More) ---- */
#scrim{position:fixed;inset:0;z-index:20;background:rgba(17,17,19,.32);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:86%;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .45s var(--ease);display:flex;flex-direction:column;padding-bottom:var(--sb)}
#drawer.on{transform:none}
#drawer::before{content:"";width:38px;height:5px;border-radius:3px;background:#d0d0d4;margin:8px auto 0;flex:none}
.dh{display:flex;align-items:center;gap:10px;padding:10px 16px 12px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.015em;flex:1}
.dbody{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.tabs{display:flex;margin:0 16px 14px;background:#e7e7ea;border-radius:12px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font:500 13px var(--f-display);cursor:pointer;transition:background .25s var(--ease),box-shadow .25s}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.grp{margin:0 16px 18px;animation:rise .4s var(--ease) both}
.grp:nth-child(3){animation-delay:.04s}.grp:nth-child(4){animation-delay:.08s}.grp:nth-child(5){animation-delay:.12s}
.grp h4{margin:0 0 6px 14px;font:500 12px var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.gl{background:var(--surface);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:0;background:transparent;font:400 15px var(--f-display);text-align:left;cursor:pointer;position:relative;transition:background .15s}
button.li:active,label.li:active{background:var(--surface-2)}
.li+.li::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.li>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li em{font-style:normal;color:var(--muted);font-size:15px;white-space:nowrap}
.li>.ic{width:21px;height:21px;color:var(--fg)}
.li>.ic:last-child{width:17px;height:17px;color:var(--muted)}
.li.danger,.li.danger>.ic{color:var(--bad)}
.li input{width:110px;text-align:right;border:0;background:transparent;color:var(--muted);font:400 15px var(--f-display);padding:8px 0}
.li input[type=text]{width:60%}
.li .sw{width:28px;height:28px}
.li .dot{margin:0}.li .dot.bad{background:var(--bad)}.li .dot.warn{background:var(--warn)}
.grp .gal{padding:10px;grid-template-columns:repeat(4,1fr)}
.grp textarea{width:100%;border:0;background:transparent;padding:12px 14px;font:400 15px var(--f-display);resize:vertical;min-height:70px}

/* ---- project stats sheet (plan view) ---- */
#sheet{left:12px;right:12px;bottom:calc(var(--navH) + 14px);border-radius:20px;padding:12px 16px;z-index:9;animation:rise .45s var(--ease)}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.shh b{font-size:17px;font-weight:700}
#pjInfo{background:transparent}#pjInfo .ic{width:21px;height:21px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stats span{display:block;font:500 10px var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.stats b{display:block;font:600 14px var(--f-display);white-space:nowrap}

/* ---- live camera HUD ---- */
#liveHud{top:calc(12px + var(--st));left:0;right:0;margin-inline:auto;width:fit-content;max-width:calc(100vw - 24px);border-radius:999px;padding:5px;display:flex;gap:5px;justify-content:center;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.src{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--surface-2);color:var(--muted);padding:0;transition:background .3s,color .3s}
.src .ic{width:16px;height:16px}
.src.on{background:var(--ok);color:#fff}.src.weak{background:#fdf0cc;color:var(--warn)}.src.off{opacity:.6}.src.rec{background:var(--bad);color:#fff}
#svRead{left:0;right:0;margin-inline:auto;width:fit-content;max-width:calc(100vw - 40px);bottom:calc(var(--navH) + 40px);border-radius:999px;padding:8px 14px;font:600 13px var(--f-display);text-align:center;line-height:1.3;background:rgba(255,255,255,.94)}
#svRead:empty{display:none}
#miniMap{top:calc(60px + var(--st));right:calc(12px + var(--sr));width:104px;height:104px;border-radius:16px;background:rgba(17,17,19,.5)}
#svPop{left:12px;bottom:calc(var(--navH) + 40px);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:220px;transform-origin:bottom left;animation:popUp .3s var(--ease)}
#svPop button{display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;background:transparent;border-radius:12px;font:500 15px var(--f-display);text-align:left;cursor:pointer}
#svPop button:disabled{opacity:.38}#svPop button .ic{width:20px;height:20px}
#svPop button[aria-pressed="true"]{background:var(--surface-2)}
#svPop button[aria-pressed="true"]::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mini{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;background:var(--surface);border:0;box-shadow:var(--sh);transition:transform .2s var(--spring)}
.mini .ic{width:19px;height:19px}.mini:disabled{opacity:.4}.mini.act{background:var(--fg);color:#fff}
#scanBox{left:12px;right:12px;bottom:calc(var(--navH) + 120px);border-radius:16px;padding:12px 14px;font:500 13px var(--f-display)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar>div{height:100%;background:var(--fg);width:0;transition:width .2s}

/* ---- overlays ---- */
#gpsOv{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(30,30,34,.78);-webkit-backdrop-filter:grayscale(1) blur(4px);backdrop-filter:grayscale(1) blur(4px);color:#fff;animation:fadeIn .35s var(--ease)}
.gpsBox{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;text-align:center;animation:rise .5s var(--ease)}
.gpsBox .fig8{width:180px;height:auto}
.gpsBox .ph{offset-path:path('M80 45 C55 10 15 10 15 45 S55 80 80 45 S145 10 145 45 S105 80 80 45Z');offset-rotate:auto 90deg;animation:fig8 3.2s linear infinite}
@keyframes fig8{from{offset-distance:0%}to{offset-distance:100%}}
.gpsBox b{font-size:19px;font-weight:600}
.gpsChips{display:flex;gap:10px}
.gpsChips span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:14px;transition:background .3s}
.gpsChips span svg{width:18px;height:18px}
.gpsChips span.ok{background:#1fa45a}.gpsChips span.weak{background:#c98a12}.gpsChips span.off{color:rgba(255,255,255,.7)}
.gpsBtns{display:flex;gap:22px;margin-top:6px}
.gpsBtns .lnk{background:none;border:0;color:rgba(255,255,255,.85);font:500 15px var(--f-display);padding:10px 6px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
#startOv{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;background:rgba(0,0,0,.22);animation:fadeIn .4s}
#startOv div{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;font:500 15px var(--f-display);text-shadow:0 1px 3px rgba(0,0,0,.5)}
#startOv svg{width:150px;height:auto;animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}

/* ---- projects screen ---- */
#home{position:fixed;inset:0;z-index:9;background:var(--bg);overflow-y:auto;padding:calc(20px + var(--st)) 16px calc(var(--navH) + 30px);display:flex;justify-content:center}
body:not(.home) #home{display:none}
body.home .tr,body.home #sheet,body.home #props,body.home #c3d,body.home #plan,body.home #editBtn{display:none!important}
.hm{width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
.hm h1{margin:8px 4px 4px;font-size:30px;font-weight:700;letter-spacing:-.025em}
.hm .sub{margin:-8px 4px 6px;font-size:14px}
#pjList{display:flex;flex-direction:column;gap:10px;background:transparent;overflow:visible}
#pjList .li{min-height:78px;background:var(--surface);border-radius:18px;box-shadow:var(--sh);padding:0 14px 0 10px;animation:rise .45s var(--ease) both}
#pjList .li::before{display:none}
#pjList .li:nth-child(2){animation-delay:.05s}#pjList .li:nth-child(3){animation-delay:.1s}#pjList .li:nth-child(4){animation-delay:.15s}#pjList .li:nth-child(n+5){animation-delay:.2s}
#pjList .li:active{transform:scale(.98);transition:transform .2s var(--spring)}
#pjList .li span b{display:block;font-weight:600;font-size:16px}
#pjList .li span small{display:block;font-size:13px;color:var(--muted)}
#pjList .cur,#pjList .nocur{display:none}
#pjList .li.curPj{box-shadow:0 0 0 2px var(--fg),var(--sh)}
#pjList .th{width:58px;height:58px;flex:none;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
#pjList i.th svg{width:24px;height:24px}
#pjList svg.th .wl line{stroke:var(--fg);stroke-width:2;stroke-linecap:round}
#pjList svg.th .rm polygon{fill:rgba(17,17,19,.07);stroke:none}
.pjEmpty{padding:40px 14px;color:var(--muted);font-size:15px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.pjEmpty .ic{width:38px;height:38px;color:#c4c4c9}
#pjSheet{position:fixed;inset:0;z-index:30;background:rgba(17,17,19,.32);display:flex;align-items:flex-end;animation:fadeIn .3s var(--ease)}
.pjs{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + var(--sb));display:flex;flex-direction:column;gap:6px;animation:sheetUp .45s var(--ease)}
.pjs::before{content:"";width:38px;height:5px;border-radius:3px;background:#d0d0d4;margin:0 auto 10px}
.pjs h2{margin:0 4px}.pjs .note{margin:0 4px 8px;font-size:13px}

/* ---- bottom tab bar: bubble in a notch ---- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;height:var(--navH);pointer-events:none}
#nav svg.navBg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 -2px 12px rgba(17,17,19,.08))}
#nav svg.navBg path{fill:var(--surface)}
#navBub{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--fg),0 6px 16px rgba(17,17,19,.18);display:grid;place-items:center;pointer-events:auto;cursor:pointer;border:0;padding:0;will-change:transform}
#navBub .ic{width:25px;height:25px;transition:opacity .16s,transform .3s var(--spring)}
#navBub.swap .ic{opacity:0;transform:scale(.5)}
#navBub.press{animation:bubPress .35s var(--spring)}
@keyframes bubPress{40%{scale:.88}100%{scale:1}}
#navBub.dis{opacity:.45}
#navBub .badge{position:absolute;right:-1px;top:-1px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
#navBub .badge .ic{width:13px;height:13px}
#navItems{position:absolute;left:0;right:0;top:0;height:var(--barH);display:flex;pointer-events:auto;padding:0 calc(6px + var(--sr)) 0 calc(6px + var(--sl))}
#navItems button{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:0 2px 10px;font:500 11px var(--f-display);color:var(--fg);cursor:pointer;position:relative}
#navItems button .ic{width:23px;height:23px;transition:transform .45s var(--ease),opacity .25s}
#navItems button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;transition:transform .45s var(--ease)}
#navItems button.on .ic{opacity:0;transform:translateY(-14px) scale(.6)}
#navItems button.on span{font-weight:600}
#navItems button:disabled{opacity:.35}
#navItems button:not(.on):active .ic{transform:scale(.85)}
body.surveying #nav svg.navBg path{fill:rgba(255,255,255,.96)}

#scanBtn,#nextBtn,#doneBtn,#svMenuBtn,#devBar,#stepTag,#menuBtn,.hmGo,#svTools{display:none!important}
body.surveying #editBtn,body.surveying .tr{display:none!important}
body.editing #lineCv{display:none}
#vlBar{top:calc(56px + var(--st));left:0;right:0;margin-inline:auto;width:min(280px,calc(100vw - 150px));border-radius:999px;padding:7px 12px;display:flex;align-items:center;gap:10px;font:600 13px var(--f-display);background:rgba(255,255,255,.94);animation:rise .35s var(--ease)}
#vlBar i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
#vlBar i b{display:block;height:100%;background:var(--fg);border-radius:3px;transition:width .5s var(--ease),background .4s}
#vlBar.ok i b{background:var(--ok)}#vlBar.ok{color:#0c5132}
#vlBar em{font-style:normal;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
#vlBar.learn{width:fit-content;padding:6px 12px;gap:6px}#vlBar.learn .ic{width:16px;height:16px}
#spotLayer{position:fixed;inset:0;z-index:6;pointer-events:none}
.spot,#spotGhost,.spPulse{position:fixed;left:0;top:0;width:60px;height:60px;border-radius:50%;background:center/cover no-repeat;
  -webkit-mask:radial-gradient(circle,#000 45%,rgba(0,0,0,.55) 62%,transparent 71%);mask:radial-gradient(circle,#000 45%,rgba(0,0,0,.55) 62%,transparent 71%);transition:opacity .25s}
.spot{pointer-events:auto;touch-action:none;cursor:grab;will-change:transform}
.spot i,#spotGhost i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(17,17,19,.8)}
.spot.ok i{background:var(--ok)}.spot.auto i{background:#9be2b8}
#spotGhost{z-index:45;width:76px;height:76px;pointer-events:none;opacity:.9}
#spotGhost::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:40px;margin-left:-1px;background:rgba(255,255,255,.85)}
.spPulse{z-index:44;width:70px;height:70px;margin:-35px 0 0 -35px;animation:spIn .7s var(--ease) forwards;pointer-events:none}
@keyframes spIn{0%{transform:scale(1.6);opacity:0}30%{opacity:1}100%{transform:scale(.6);opacity:0}}
#spotTray{left:12px;right:12px;bottom:calc(var(--navH) + 92px);border-radius:999px;padding:6px;display:flex;gap:6px;overflow-x:auto;width:fit-content;max-width:calc(100vw - 24px);background:rgba(255,255,255,.92)}
#spotTray .st{width:44px;height:44px;flex:none;border-radius:50%;border:0;padding:0;background:center/cover no-repeat;box-shadow:inset 0 0 0 2px #fff,0 0 0 1px var(--line);cursor:grab;touch-action:none}
#spotTray .st.ok{box-shadow:inset 0 0 0 2px #fff,0 0 0 2.5px var(--ok)}#spotTray .st.auto{box-shadow:inset 0 0 0 2px #fff,0 0 0 2px #9be2b8}
/* ---- wall editor ---- */
#plan .hdl{cursor:grab;touch-action:none}
#plan .hdl.drag{cursor:grabbing}
#wallSheet{left:12px;right:12px;bottom:calc(var(--navH) + 14px);z-index:16;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;animation:popUp .35s var(--ease)}
#wallSheet .whd{display:flex;align-items:center;justify-content:space-between}
#wallSheet .whd b{font-size:16px}
#wallSheet .wf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#wallSheet label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
#wallSheet .stp{display:flex;align-items:center;gap:4px}
#wallSheet .stp button{width:36px;height:40px;border:0;border-radius:10px;background:var(--surface-2);font:600 18px var(--f-display);cursor:pointer;flex:none}
#wallSheet .stp input{text-align:center;padding:9px 4px}
#wallSheet .wadd{display:grid;grid-template-columns:1fr 1fr;gap:8px}#wallSheet .wadd .btn{justify-content:center}
#wallSheet .whd .seg{flex:1;margin-right:10px}
body.editing #sheet,body.surveying #sheet{display:none}
body.editing.surveying #plan{background:rgba(247,247,248,.97)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

// Two tracking engines, picked automatically:
//  1. WebXR "immersive-ar" (Chrome Android + ARCore, HTTPS): the camera itself tracks position and rotation (visual-inertial odometry).
//  2. Sensor fusion fallback (Android WebView / APK, iOS): rear camera as background, gyroscope + compass for rotation,
//     accelerometer step detection for walking, GPS blended in when its accuracy is good enough.

async function startLive(){
  if(live)return stopLive();

  try{if(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar'))return startXR();}catch(_){}

function navGo(k,icn,badge){const x1=navX(k);
  if(NAV.x==null||matchMedia('(prefers-reduced-motion: reduce)').matches){NAV.x=x1;navSetBubIcon(icn,badge);navDraw(x1,0);return;}
  if(Math.abs(x1-NAV.x)<1&&!NAV.anim){if(NAV.bubIc!==ic(icn)+(badge?`<i class="badge">${ic(badge)}</i>`:'')){bubEl.classList.add('swap');setTimeout(()=>{navSetBubIcon(icn,badge);bubEl.classList.remove('swap');},150);}navDraw(x1,0);return;}
  const x0=NAV.x,t0=performance.now(),dur=560;let swapped=false;bubEl.classList.add('swap');if(NAV.anim)cancelAnimationFrame(NAV.anim);
  const step=now=>{const t=Math.min(1,(now-t0)/dur),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,dip=Math.sin(Math.PI*t);
    NAV.x=x0+(x1-x0)*e;navDraw(NAV.x,dip);
    if(!swapped&&t>.42){swapped=true;navSetBubIcon(icn,badge);bubEl.classList.remove('swap');}
    NAV.anim=t<1?requestAnimationFrame(step):null;};
  NAV.anim=requestAnimationFrame(step);}
function navRender(items,active,bub){const el=$('navItems');
  const sig=items.map(i=>`${i.k}:${i.ic}:${i.label}:${i.dis?1:0}`).join('|')+'#'+active;
  if(sig!==NAV.sig){NAV.sig=sig;
    el.innerHTML=items.map(i=>`<button data-k="${i.k}" id="nav-${i.k}" ${i.dis?'disabled':''} class="${i.k===active?'on':''}" ${i.k===active?'aria-current="page"':''} aria-label="${esc(i.label)}">${ic(i.ic)}<span>${esc(i.label)}</span></button>`).join('');
    items.forEach(i=>{const b=el.querySelector(`[data-k="${i.k}"]`);b.onclick=e=>{e.stopPropagation();if(i.on)i.on();};});}
  NAV.bub=bub;bubEl.setAttribute('aria-label',bub.label||'');bubEl.classList.toggle('dis',!!bub.dis);
  navGo(active,bub.ic,bub.badge);}
bubEl.addEventListener('click',e=>{e.stopPropagation();const b=NAV.bub;if(!b||b.dis||!b.on)return;bubEl.classList.remove('press');void bubEl.offsetWidth;bubEl.classList.add('press');b.on();});
addEventListener('resize',()=>{NAV.x=null;NAV.sig='';navRefresh();});
let navPending=null;
function navThen(k,fn){if(navPending)return;const it={pj:'folder',plan:'floor-plan',new:'plus',ar:'view',more:'menu'}[k];
  $('navItems').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.k===k);});NAV.sig='';navGo(k,it);
  navPending=setTimeout(()=>{navPending=null;Promise.resolve(fn()).catch(e=>{flash('Camera failed: '+(e&&e.message||e));if(S)finishSurvey();});navRefresh();},330);}
const DEV_SHORT={panel:'Panel',socket:'Socket',switch:'Switch',light:'Light'};
function curHasPlan(){const p=projects.find(q=>q.id===curId);return !!(p&&p.plan.walls.length);}
function startAR(){return startLocate();}
function openPlan(){document.body.classList.remove('home');$('pjSheet').hidden=true;setView(view3d);refresh();}
function navRefresh(){if(!navEl)return;
  if(typeof S!=='undefined'&&S){
    if(S.phase==='locate'){
      if(S.alignMode){navRender([{k:'tools',ic:'menu',label:'Tools',on:toggleSvPop},{k:'align',ic:'target',label:'Align',on:svPrimary},{k:'done',ic:'check',label:'Done',on:finishSurvey}],'align',{ic:'target',label:'Align on this corner',on:svPrimary});return;}
      const opts=devs.some(d=>d.type==='panel')?['socket','switch','light']:['panel'];if(!opts.includes(S.devType))S.devType=opts[0];
      navRender([{k:'tools',ic:'menu',label:'Tools',on:toggleSvPop}].concat(opts.map(k=>({k,ic:TYPES[k].ic,label:DEV_SHORT[k],on:()=>{if(S.devType===k)svPrimary();else{S.devType=k;svUI();}}})),[{k:'done',ic:'check',label:'Done',on:finishSurvey}]),
        S.devType,{ic:TYPES[S.devType].ic,badge:'plus',label:'Place '+TYPES[S.devType].label,on:svPrimary});return;}
    const ph=svPhase(),p=S.modify&&ph==='corner'?['pencil-outline','Move the last corner here']:PH[ph],lbl={low:'Floor',high:'Ceiling',corner:S.modify?'Move':'Corner'}[ph];
    navRender([{k:'tools',ic:'menu',label:'Tools',on:toggleSvPop},{k:'undo',ic:'undo',label:'Undo',dis:!S.chain.length||editing,on:()=>{S.modify=false;undoCorner();}},
      {k:'cap',ic:p[0],label:lbl,dis:editing,on:svPrimary},{k:'edit',ic:'wall-edit',label:'Edit',dis:!plan.walls.length,on:()=>toggleEdit()},{k:'done',ic:'check',label:'Done',on:finishSurvey}],
      editing?'edit':'cap',editing?{ic:'check',label:'Finish editing',on:()=>toggleEdit(false)}:{ic:p[0],label:p[1],on:svPrimary});return;}
  const home=document.body.classList.contains('home'),has=curHasPlan(),more=$('drawer').classList.contains('on');
  const act=more?'more':home?'pj':'plan';
  navRender([{k:'pj',ic:'folder',label:'Projects',on:()=>{openMenu(false);if(editing)toggleEdit(false);goHome();}},{k:'plan',ic:'floor-plan',label:'Plan',dis:!has&&home,on:()=>{openMenu(false);openPlan();}},
    {k:'new',ic:'plus',label:'New',on:()=>{openMenu(false);navThen('new',newProject);}},{k:'ar',ic:'view',label:'AR Viewer',dis:!has,on:()=>{openMenu(false);if(editing)toggleEdit(false);navThen('ar',startAR);}},
    {k:'more',ic:'menu',label:'More',on:()=>{if(more)openMenu(false);else{menuTab=null;openMenu(true);}}}],act,{ic:{pj:'folder',plan:'floor-plan',more:'menu'}[act],label:act,on:act==='more'?()=>openMenu(false):null});}
function toggleSvPop(){const o=$('svPop').hidden;$('svPop').hidden=!o;if(o){const x=navX('tools');$('svPop').style.left=Math.max(12,x-30)+'px';}}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#svPop,#nav-tools'))$('svPop').hidden=true;},true);

// ---------- wall editor: drag corner points, read/set length and angle ----------
const ckey=p=>p[0].toFixed(3)+','+p[1].toFixed(3);
function cornerRefs(x,y){const out=[],add=a=>{if(Math.abs(a[0]-x)<2e-3&&Math.abs(a[1]-y)<2e-3&&!out.includes(a))out.push(a);};
  plan.walls.forEach(w=>w.forEach(add));(plan.rooms||[]).forEach(r=>r.pts.forEach(add));if(typeof S!=='undefined'&&S&&S.chain)S.chain.forEach(add);return out;}
function wallsAt(x,y){const r=[];plan.walls.forEach((w,i)=>w.forEach((p,e)=>{if(Math.abs(p[0]-x)<2e-3&&Math.abs(p[1]-y)<2e-3)r.push({i,e});}));return r;}
function cornerAngle(x,y){const ws=wallsAt(x,y);if(ws.length<2)return null;const v=ws.slice(0,2).map(({i,e})=>{const q=plan.walls[i][1-e];return Math.atan2(q[1]-y,q[0]-x);});
  let a=Math.abs(v[0]-v[1])*180/Math.PI;if(a>180)a=360-a;return{a,bis:Math.atan2(Math.sin(v[0])+Math.sin(v[1]),Math.cos(v[0])+Math.cos(v[1]))};}
function toggleEdit(on){editing=on==null?!editing:on;document.body.classList.toggle('editing',editing);$('editBtn').setAttribute('aria-pressed',editing);wsel=null;osel=null;$('wallSheet').hidden=true;
  if(editing){if(typeof S!=='undefined'&&S){svg.removeAttribute('hidden');$('svPop').hidden=true;}else{editPrev3d=view3d;setView(false);}PV=null;PV=fitPV();osel=null;drawPlan();flash('Drag a point · tap a wall · pinch to zoom');}
  else{osel=null;flashMsg=null;setStatus();if(typeof S!=='undefined'&&S)svg.setAttribute('hidden','');else setView(editPrev3d);save();build();}
  navRefresh();}
function svgRaw(x,y){return s2w(x,y,curPV());}
function snapCorner(p,start){const lines=[];const D=4*Math.PI/180;
  wallsAt(start[0],start[1]).forEach(({i,e})=>{const Q=plan.walls[i][1-e];const nb=wallsAt(Q[0],Q[1]).find(o=>o.i!==i);if(!nb)return;
    const R=plan.walls[nb.i][1-nb.e],ra=Math.atan2(R[1]-Q[1],R[0]-Q[0]),a=Math.atan2(p[1]-Q[1],p[0]-Q[0]);
    for(let k=0;k<4;k++){const c=ra+k*Math.PI/2;let d=Math.atan2(Math.sin(a-c),Math.cos(a-c));if(Math.abs(d)<D){lines.push({Q,u:[Math.cos(c),Math.sin(c)]});break;}}});
  if(lines.length===1){const{Q,u}=lines[0],t=(p[0]-Q[0])*u[0]+(p[1]-Q[1])*u[1];p=[Q[0]+u[0]*t,Q[1]+u[1]*t];}
  else if(lines.length>=2){const[a,b]=lines,den=a.u[0]*b.u[1]-a.u[1]*b.u[0];if(Math.abs(den)>.2){const t=((b.Q[0]-a.Q[0])*b.u[1]-(b.Q[1]-a.Q[1])*b.u[0])/den;p=[a.Q[0]+a.u[0]*t,a.Q[1]+a.u[1]*t];}}
  return[Math.round(p[0]*100)/100,Math.round(p[1]*100)/100];}
function moveCorner(refs,p){refs.forEach(a=>{a[0]=p[0];a[1]=p[1];});}
function animCorner(refs,to,done){const from=refs[0].slice(),t0=performance.now();const st=now=>{const t=Math.min(1,(now-t0)/260),e=1-Math.pow(1-t,3);
  moveCorner(refs,[from[0]+(to[0]-from[0])*e,from[1]+(to[1]-from[1])*e]);drawPlan();if(t<1)requestAnimationFrame(st);else{moveCorner(refs,to);drawPlan();build();save();if(done)done();}};requestAnimationFrame(st);}
function wallInfo(i){const[A,B]=plan.walls[i],L=Math.hypot(B[0]-A[0],B[1]-A[1]);const prev=wallsAt(A[0],A[1]).find(o=>o.i!==i);
  if(prev){const P=plan.walls[prev.i][1-prev.e],a1=Math.atan2(P[1]-A[1],P[0]-A[0]),a2=Math.atan2(B[1]-A[1],B[0]-A[0]);let d=a2-a1;d=Math.atan2(Math.sin(d),Math.cos(d));return{L,ang:Math.abs(d)*180/Math.PI,sgn:d>=0?1:-1,ref:a1,rel:true};}
  return{L,ang:((Math.atan2(B[1]-A[1],B[0]-A[0])*180/Math.PI)+360)%360,sgn:1,ref:0,rel:false};}
function setWall(i,L,ang){const[A,B]=plan.walls[i],w=wallInfo(i);L=Math.max(0.2,L);const a=w.rel?w.ref+w.sgn*ang*Math.PI/180:ang*Math.PI/180;
  const to=[+(A[0]+Math.cos(a)*L).toFixed(3),+(A[1]+Math.sin(a)*L).toFixed(3)];animCorner(cornerRefs(B[0],B[1]),to,renderWallSheet);}
function delWall(i){plan.walls.splice(i,1);plan.openings=(plan.openings||[]).filter(o=>o.wall!==i).map(o=>(o.wall>i&&o.wall--,o));devs=devs.filter(d=>d.wall!==i);devs.forEach(d=>{if(d.wall>i)d.wall--;});
  if(typeof S!=='undefined'&&S&&S.chainWall0>i)S.chainWall0--;wsel=null;$('wallSheet').hidden=true;save();build();drawPlan();navRefresh();}
function addOp2D(type){if(wsel==null)return;const D=OPEN[type],g=wallGeo(wsel);const o={id:ops().reduce((m,q)=>Math.max(m,q.id),0)+1,type,wall:wsel,t:PG.tapT||0.5,w:D.w,h:Math.min(D.h,plan.height-D.sill-0.05),sill:D.sill};fitOpening(o);
  const free=t=>!opsOn(wsel).some(q=>Math.abs(q.t-t)*g.L<(q.w+o.w)/2+0.02);
  if(!free(o.t)){const half=(o.w/2+0.05)/g.L;let best=null;for(let t=half;t<=1-half;t+=0.01)if(free(t)&&(best==null||Math.abs(t-o.t)<Math.abs(best-o.t)))best=t;if(best==null){flash('No room on this wall');return;}o.t=best;}
  ops().push(o);osel=o.id;wsel=null;save();build();drawPlan();renderWallSheet();flash(`${D.label} added`);}
function renderOpSheet(){const el=$('wallSheet'),o=ops().find(q=>q.id===osel);if(!o){el.hidden=true;return;}const num=v=>parseFloat(String(v).replace(',','.'));
  const fld=(id,l,v)=>`<label>${l}<span class="stp"><button data-st="${id}:-1" aria-label="Less">−</button><input id="${id}" type="number" inputmode="decimal" step="0.01" value="${v.toFixed(2)}"><button data-st="${id}:1" aria-label="More">+</button></span></label>`;
  el.innerHTML=`<div class="whd"><div class="seg" role="group" aria-label="Type"><button id="opD" aria-pressed="${o.type==='door'}">${ic('door')}Door</button><button id="opW" aria-pressed="${o.type==='window'}">${ic('window-closed-variant')}Window</button></div><button class="icon" id="opDel" aria-label="Delete">${ic('trash-can-outline')}</button></div>
   <div class="wf">${fld('opWd','Width (m)',o.w)}${fld('opH','Height (m)',o.h)}${o.type==='window'?fld('opS','Sill (m)',o.sill):''}</div>`;el.hidden=false;
  const apply=()=>{const g=wallGeo(o.wall);o.w=Math.max(0.3,Math.min(g.L-0.1,o.w));o.sill=o.type==='door'?0:Math.max(0,Math.min(plan.height-0.3,o.sill));o.h=Math.max(0.3,Math.min(plan.height-o.sill-0.02,o.h));fitOpening(o);save();build();drawPlan();renderOpSheet();};
  $('opD').onclick=()=>{o.type='door';o.sill=0;o.h=Math.min(OPEN.door.h,plan.height-0.05);apply();};$('opW').onclick=()=>{o.type='window';o.sill=OPEN.window.sill;o.h=OPEN.window.h;apply();};
  $('opDel').onclick=()=>{plan.openings=ops().filter(q=>q!==o);osel=null;save();build();drawPlan();el.hidden=true;};
  const key={opWd:'w',opH:'h',opS:'sill'};Object.keys(key).forEach(id=>{const i=$(id);if(i)i.onchange=e=>{const v=num(e.target.value);if(v>=0){o[key[id]]=v;apply();}};});
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const[id,d]=b.dataset.st.split(':');o[key[id]]=+(o[key[id]]+d*0.05).toFixed(2);apply();});}
function renderWallSheet(){const el=$('wallSheet');if(osel!=null){renderOpSheet();return;}if(wsel==null||!plan.walls[wsel]){el.hidden=true;return;}const w=wallInfo(wsel);
  const f=(document.activeElement&&el.contains(document.activeElement))?document.activeElement.id:null;
  el.innerHTML=`<div class="whd"><b>Wall ${wsel+1}</b><button class="icon" id="wsDel" aria-label="Delete wall">${ic('trash-can-outline')}</button></div>
   <div class="wf"><label>Length (m)<span class="stp"><button id="wsLm" aria-label="Shorter">−</button><input id="wsL" type="number" inputmode="decimal" step="0.01" value="${w.L.toFixed(2)}"><button id="wsLp" aria-label="Longer">+</button></span></label>
   <label>${w.rel?'Angle (°)':'Direction (°)'}<span class="stp"><button id="wsAm" aria-label="Less">−</button><input id="wsA" type="number" inputmode="decimal" step="1" value="${w.ang.toFixed(1)}"><button id="wsAp" aria-label="More">+</button></span></label></div>
   <div class="row wadd"><button class="btn" id="wsDoor">${ic('door')}Add door</button><button class="btn" id="wsWin">${ic('window-closed-variant')}Add window</button></div>`;
  el.hidden=false;const num=v=>parseFloat(String(v).replace(',','.'));
  $('wsL').onchange=e=>{const v=num(e.target.value);if(v>0)setWall(wsel,v,wallInfo(wsel).ang);};$('wsA').onchange=e=>{const v=num(e.target.value);if(!isNaN(v))setWall(wsel,wallInfo(wsel).L,v);};
  $('wsLm').onclick=()=>{const x=wallInfo(wsel);setWall(wsel,x.L-0.05,x.ang);};$('wsLp').onclick=()=>{const x=wallInfo(wsel);setWall(wsel,x.L+0.05,x.ang);};
  $('wsAm').onclick=()=>{const x=wallInfo(wsel);setWall(wsel,x.L,x.ang-1);};$('wsAp').onclick=()=>{const x=wallInfo(wsel);setWall(wsel,x.L,x.ang+1);};
  $('wsDel').onclick=()=>delWall(wsel);$('wsDoor').onclick=()=>addOp2D('door');$('wsWin').onclick=()=>addOp2D('window');if(f&&$(f))$(f).focus();}
$('editBtn').innerHTML=ic('wall-edit');$('editBtn').onclick=()=>toggleEdit();

paintIcons();size();setCam(true);themeScene();refresh();goHome();renderer.setAnimationLoop(loop);
})();
